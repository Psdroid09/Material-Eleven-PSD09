name: Publicar Material-Eleven PSD09

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publicar-material-eleven.yml
      - scripts/patch-joystick.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Material-Eleven original 3.9.0
        run: git clone --depth 1 --branch v3.9.0 https://github.com/Perroabuelo/Material-Eleven.git material-eleven

      - name: Añadir únicamente el cambio de canción con joystick y pantalla apagada
        run: python3 scripts/patch-joystick.py

      - name: Compilar VPK
        run: |
          cmake -S material-eleven -B material-eleven/build
          cmake --build material-eleven/build -j"$(nproc)"
          test -s material-eleven/build/ElevenMPV.vpk

      - name: Preparar VPK
        run: |
          mkdir -p dist
          cp material-eleven/build/ElevenMPV.vpk dist/Material-Eleven-3.9.0-PSD09-joystick.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: material-eleven-joystick
          path: dist/Material-Eleven-3.9.0-PSD09-joystick.vpk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: material-eleven-joystick
          path: dist

      - name: Actualizar release con un solo VPK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          # Material-Eleven 3.9.0 — PSD09 Joystick

          Basado directamente en **Material-Eleven 3.9.0**, desarrollado por **Perroabuelo**.

          Se conserva el reproductor original y se añade únicamente el control para cambiar de canción con el **joystick derecho mientras la pantalla está apagada**:
          - START: apaga la pantalla y mantiene la reproducción.
          - Joystick derecho a la izquierda: canción anterior.
          - Joystick derecho a la derecha: canción siguiente.
          - Devuelve el stick al centro entre cambios para registrar el siguiente movimiento.

          Esta publicación contiene un solo VPK. No incluye control por cruceta ni otras modificaciones de funciones.

          **Créditos:** Material-Eleven por Perroabuelo; ElevenMPV de Joel16; componentes de ElevenMPV-A de GrapheneCt y colaboradores. Se conservan los avisos y licencias originales del proyecto base.
          EOF

          gh release delete-asset v3.9.0-PSD09.1 Material-Eleven-3.9.0-PSD09-cruceta.vpk --yes || true
          gh release upload v3.9.0-PSD09.1 dist/Material-Eleven-3.9.0-PSD09-joystick.vpk --clobber
          gh release edit v3.9.0-PSD09.1 --title "Material-Eleven 3.9.0 — PSD09 Joystick" --notes-file release-notes.md
          gh release view v3.9.0-PSD09.1 --json url,assets
