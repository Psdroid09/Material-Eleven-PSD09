name: Publicar Material-Eleven PSD09

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publicar-material-eleven.yml
      - scripts/patch-*.py
  pull_request:
    paths:
      - .github/workflows/publicar-material-eleven.yml
      - scripts/patch-*.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar una release nueva (no sobrescribe etiquetas existentes)"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Etiqueta nueva para la release"
        required: true
        type: string
        default: "v3.9.0-PSD09.2"

permissions:
  contents: read

concurrency:
  group: material-eleven-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [joystick, cruceta]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Material-Eleven oficial 3.9.0
        run: git clone --depth 1 --branch v3.9.0 https://github.com/Perroabuelo/Material-Eleven.git material-eleven

      - name: Integrar controles experimentales
        run: python3 scripts/patch-${{ matrix.variant }}.py

      - name: Compilar VPK
        run: |
          cmake -S material-eleven -B material-eleven/build
          cmake --build material-eleven/build -j"$(nproc)"
          test -s material-eleven/build/ElevenMPV.vpk

      - name: Renombrar VPK
        run: |
          mkdir -p dist
          cp material-eleven/build/ElevenMPV.vpk dist/Material-Eleven-3.9.0-PSD09-${{ matrix.variant }}.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: material-vpk-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: material-vpk-*
          path: dist
          merge-multiple: true

      - name: Verificar VPK y hashes
        run: |
          test -s dist/Material-Eleven-3.9.0-PSD09-joystick.vpk
          test -s dist/Material-Eleven-3.9.0-PSD09-cruceta.vpk
          (cd dist && sha256sum *.vpk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Publicar release nueva
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "La etiqueta $RELEASE_TAG ya existe; no se sobrescribira." >&2
            exit 1
          fi
          cat > /tmp/release-notes.md <<'EOF'
          Material-Eleven PSD09 — fork basado en Material-Eleven 3.9.0.

          - joystick: stick derecho para cambiar de pista con la pantalla apagada. Probada por el usuario en PS Vita.
          - cruceta: izquierda/derecha para cambiar de pista con la pantalla apagada. Variante experimental; la lectura de botones digitales aún debe confirmarse.

          Instala solo una variante: ambas comparten el identificador ELEVENMPV.
          Se adjunta SHA256SUMS.txt para verificar la integridad de los VPK descargados.

          Proyecto original: https://github.com/Perroabuelo/Material-Eleven
          Inspiración para el control con stick: https://github.com/GrapheneCt/ElevenMPV-A
          Código derivado bajo GPL-3.0-or-later; conserva los créditos y avisos originales.
          EOF
          gh release create "$RELEASE_TAG" dist/*.vpk dist/SHA256SUMS.txt \
            --title "Material-Eleven PSD09 3.9.0 — $RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            --target main
